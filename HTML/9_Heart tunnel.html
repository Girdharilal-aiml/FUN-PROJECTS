<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart tunnel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010004;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .warp-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 240, 255, 0.7);
            font-size: 13px;
            letter-spacing: 4px;
            pointer-events: none;
            animation: pulseText 1.5s infinite alternate ease-in-out;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            z-index: 10;
        }
        @keyframes pulseText {
            0% { opacity: 0.3; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
        #scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
            opacity: 0.3;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none bg-black">

    <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-crosshair"></div>
    <div id="scanlines"></div>
    <div class="warp-prompt"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const tunnelDepth = 2000;
        scene.fog = new THREE.Fog(0x010004, 100, tunnelDepth * 0.85);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, tunnelDepth + 500);
        camera.position.set(0, 0, 50);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        const points = [];
        const resolution = 150;
        for (let i = 0; i <= Math.PI * 2; i += (Math.PI * 2) / resolution) {
            const x = 16 * Math.pow(Math.sin(i), 3);
            const y = 13 * Math.cos(i) - 5 * Math.cos(2 * i) - 2 * Math.cos(3 * i) - Math.cos(4 * i);
            points.push(new THREE.Vector3(x, y, 0));
        }
        points.push(points[0]);
        const heartGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const ringCount = 180;
        const rings = [];
        const colorPink = new THREE.Color(0xff0055);
        const colorCyan = new THREE.Color(0x00f0ff);
        const colorPurple = new THREE.Color(0x7b2cbf);

        for (let i = 0; i < ringCount; i++) {
            const material = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                linewidth: 2
            });

            const ring = new THREE.Line(heartGeometry, material);
            ring.position.z = - (i / ringCount) * tunnelDepth;
            ring.userData = { 
                index: i,
                baseScale: 1.2 + (Math.random() * 0.2)
            };
            scene.add(ring);
            rings.push(ring);
        }

        
    </script>
</body>
</html>
