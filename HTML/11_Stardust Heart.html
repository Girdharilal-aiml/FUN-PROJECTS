<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030005;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>
<canvas id="heart-canvas"></canvas>
<script>
const canvas = document.getElementById("heart-canvas");
const ctx = canvas.getContext("2d");
let width, height;
function resize() {
    width = canvas.width = innerWidth;
    height = canvas.height = innerHeight;
}

addEventListener("resize", resize);
resize();
let angleX = 0;
let angleY = 0;
let isDragging = false;
let lastX = 0;
let lastY = 0;
const particles = [];
const fireflies = [];
const timeStep = 0.03;
for (let i = 0; i < 15000; i++) {
    const t = Math.random() * Math.PI * 2;
    particles.push({
        x: (Math.random() - 0.5) * width * 1.5,
        y: (Math.random() - 0.5) * height * 1.5,
        z: (Math.random() - 0.5) * 1000,
        targetX: 16 * Math.pow(Math.sin(t), 3) * 19,
        targetY:
            -(
                13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t)
            ) * 19,

        targetZ: (Math.random() - 0.5) * 228,
        color: `hsl(${Math.random() * 50 + 325},100%,${Math.random() * 40 + 50}%)`,
        size: Math.random() * 2.2 + 0.8,
        progress: 0,
        assembleSpeed: Math.random() * 0.001 + 0.003,
        offset: Math.random() * Math.PI * 2
    });
}

for (let i = 0; i < 150; i++) {
    fireflies.push({
        x: (Math.random() - 0.5) * 1000,
        y: (Math.random() - 0.5) * 1000,
        z: (Math.random() - 0.5) * 1000,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random()
    });
}
function start(x, y) {
    isDragging = true;
    lastX = x;
    lastY = y;
}
function move(x, y) {
    if (!isDragging) return;
    angleY += (x - lastX) * 0.007;
    angleX += (y - lastY) * 0.007;
    lastX = x;
    lastY = y;
}
addEventListener("mousedown", e => start(e.clientX, e.clientY));
addEventListener("mousemove", e => move(e.clientX, e.clientY));
addEventListener("mouseup", () => (isDragging = false));
addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
        start(e.touches[0].clientX, e.touches[0].clientY);
    }
});


</script>
</body>
</html>
