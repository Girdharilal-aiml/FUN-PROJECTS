<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        let scene, camera, renderer;
        let heartParticles, ambientParticles, spiralParticles;
        let originalPositions = [], scatteredPositions = [];
        let particleVelocities = [], particleColors = [];
        const HEART_PARTICLE_COUNT = 38000;
        const AMBIENT_PARTICLE_COUNT = 500;
        const SPIRAL_PARTICLE_COUNT = 40500;
        let mouse = new THREE.Vector2(-9999, -9999);
        let raycaster = new THREE.Raycaster();
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };
        let clock = new THREE.Clock();
        let heartGroup = new THREE.Group();
        const ASSEMBLY_DURATION = 9.0;
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.18, 'rgba(255, 60, 140, 0.95)');
            gradient.addColorStop(0.45, 'rgba(220, 0, 75, 0.45)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function sampleHeartVolume() {
            let found = false;
            let x, y, z;
            
            while (!found) {
                x = (Math.random() * 2 - 1) * 1.5;
                y = (Math.random() * 2 - 1) * 1.5;
                z = (Math.random() * 2 - 1) * 1.5;
                const x2 = x * x;
                const y2 = y * y;
                const z2 = z * z;
                const term1 = x2 + 2.25 * z2 + y2 - 1;
                const formula = (term1 * term1 * term1) - (x2 * y2 * y) - (0.1125 * z2 * y2 * y);
                if (formula <= 0) {
                    found = true;
                }
            }
            
            const scale = 3.2;
            return new THREE.Vector3(x * scale, y * scale, z * scale);
        }

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.018);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 1);
            container.appendChild(renderer.domElement);
            scene.add(heartGroup);
        }

        function initHeartParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(HEART_PARTICLE_COUNT * 3);
            const colors = new Float32Array(HEART_PARTICLE_COUNT * 3);
            const sizes = new Float32Array(HEART_PARTICLE_COUNT);
            const particleTexture = createParticleTexture();
            for (let i = 0; i < HEART_PARTICLE_COUNT; i++) {
                const heartPos = sampleHeartVolume();
                originalPositions.push(heartPos.x, heartPos.y, heartPos.z);
                const radius = 18 + Math.random() * 30;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const scX = radius * Math.sin(phi) * Math.cos(theta);
                const scY = radius * Math.sin(phi) * Math.sin(theta);
                const scZ = radius * Math.cos(phi);
                scatteredPositions.push(scX, scY, scZ);
                positions[i * 3] = scX;
                positions[i * 3 + 1] = scY;
                positions[i * 3 + 2] = scZ;
                const distFromCenter = heartPos.length();
                const color = new THREE.Color();
                
                if (distFromCenter < 1.4) {
                    color.setHSL(0.95 + Math.random() * 0.05, 1.0, 0.65);
                } else if (distFromCenter < 2.7) {
                    color.setHSL(0.90 + Math.random() * 0.08, 0.95, 0.55);
                } else {
                    color.setHSL(0.82 + Math.random() * 0.12, 0.92, 0.62);
                }

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                sizes[i] = (Math.random() * 0.20 + 0.08);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const material = new THREE.PointsMaterial({
                size: 0.24,
                vertexColors: true,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.88
            });

            heartParticles = new THREE.Points(geometry, material);
            heartGroup.add(heartParticles);
        }

        function initBackgroundEffects() {
            const ambGeo = new THREE.BufferGeometry();
            const ambPos = new Float32Array(AMBIENT_PARTICLE_COUNT * 3);
            const ambCols = new Float32Array(AMBIENT_PARTICLE_COUNT * 3);
            for (let i = 0; i < AMBIENT_PARTICLE_COUNT; i++) {
                const r = 12 + Math.random() * 30;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                ambPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                ambPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                ambPos[i * 3 + 2] = r * Math.cos(phi);
                const c = new THREE.Color();
                c.setHSL(0.85 + Math.random() * 0.18, 0.8, 0.35 + Math.random() * 0.4);
                ambCols[i * 3] = c.r;
                ambCols[i * 3 + 1] = c.g;
                ambCols[i * 3 + 2] = c.b;
            }

            ambGeo.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
            ambGeo.setAttribute('color', new THREE.BufferAttribute(ambCols, 3));
            const ambMat = new THREE.PointsMaterial({
                size: 0.13,
                vertexColors: true,
                map: createParticleTexture(),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.45
            });

           

           
        }

    </script>
</body>
</html>
