<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Kaleidoscope</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="kaleidoscope"></canvas>

    <script>
        const settings = {
            size: 150,
            angle: 0.4,
            scale: 0.67,
            iterations: 10,
            animate: true,
            speed: 0.3,
            offset: 0,
            slices: 13
        };

        let width, height;
        const canvas = document.getElementById('kaleidoscope');
        const context = canvas.getContext('2d');
        const bufferCanvas = document.createElement('canvas');
        const bufferContext = bufferCanvas.getContext('2d');
        window.addEventListener('resize', resize);
        resize();

        function resize() {
            width = bufferCanvas.width = canvas.width = window.innerWidth;
            height = bufferCanvas.height = canvas.height = window.innerHeight;
            bufferContext.translate(width * 0.5, height);
            bufferContext.strokeStyle = '#c3c3c3';
        }
